[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratelattice"
version = "0.1.0"
description = "Composable token-bucket and Retry-After policies for Python clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["rate-limit", "retry-after", "token-bucket", "api", "resilience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/faizanali2k05/ratelattice"
Repository = "https://github.com/faizanali2k05/ratelattice"
Issues = "https://github.com/faizanali2k05/ratelattice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ratelattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
